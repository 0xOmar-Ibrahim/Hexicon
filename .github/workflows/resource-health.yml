name: Resource health

# Weekly: GitHub stars / last push / archived flags and link checks for every library resource.
# Writes data/resource-stats.json and docs/link-report.md.
on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run enrich:resources
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "hexicon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resource-stats.json docs/link-report.md
          git commit -m "data(resources): weekly health check"
          git push
