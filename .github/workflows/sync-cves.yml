name: Sync CVE data

# Weekly refresh of the `official:` block on every CVE page (NVD + CISA KEV + FIRST EPSS).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import new KEV entries (top 1000 by EPSS + last 180 days)
        run: npm run import:kev
      - run: npm run sync:cves -- --feeds
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Enrich CVE pages (exploits, labs, detections, ATT&CK, priority)
        run: npm run enrich:cves
      - name: Regenerate docs
        run: npm run docs
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "hexicon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs && git commit -m "data(cves): weekly sync and enrichment"
          git push
