# Hexicon — Taxonomy
# Every resource belongs to exactly one domain and one or more subdomains.
# Names are translated into all supported languages: en, de, fr, ar, ru.
# To propose a new domain/subdomain, open an issue first — don't edit this file in a resource PR.

languages: [en, de, fr, ar, ru]
rtl_languages: [ar]

domains:
  - id: fundamentals
    order: 1
    icon: compass
    name: { en: Fundamentals, de: Grundlagen, fr: Fondamentaux, ar: الأساسيات, ru: Основы }
    subdomains:
      - { id: networking,        name: { en: Networking, de: Netzwerke, fr: Réseaux, ar: الشبكات, ru: Сети } }
      - { id: linux,             name: { en: Linux, de: Linux, fr: Linux, ar: لينكس, ru: Linux } }
      - { id: windows,           name: { en: Windows, de: Windows, fr: Windows, ar: ويندوز, ru: Windows } }
