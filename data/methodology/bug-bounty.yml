  - id: learn
    icon: spark
    title:
      en: Follow through & learn
      de: Nachverfolgen & lernen
      fr: Suivre & apprendre
      ar: المتابعة والتعلّم
      ru: Доводить до конца и учиться
    goal:
      en: Make every hunt improve the next one.
      de: Jede Jagd die nächste verbessern lassen.
      fr: Faire que chaque chasse améliore la suivante.
      ar: اجعل كل عملية صيد تحسّن التي تليها.
      ru: Чтобы каждая охота улучшала следующую.
    output:
      en: Updated notes and a better personal checklist.
      de: Aktualisierte Notizen und eine bessere persönliche Checkliste.
      fr: Des notes à jour et une meilleure checklist personnelle.
      ar: ملاحظات محدّثة وقائمة تحقق شخصية أفضل.
      ru: Обновлённые заметки и улучшенный личный чек-лист.
    steps:
      - en: Answer triage questions quickly and politely.
        de: Rückfragen der Triage schnell und höflich beantworten.
        fr: Répondez vite et poliment aux questions du triage.
        ar: أجب عن أسئلة الفرز بسرعة وأدب.
        ru: Отвечайте на вопросы триажа быстро и вежливо.
      - en: When the fix ships, test it again — an incomplete fix is a new bug.
        de: Wenn der Fix live ist, erneut testen – ein unvollständiger Fix ist ein neuer Bug.
        fr: Quand le correctif est déployé, retestez — un correctif incomplet est un nouveau bug.
        ar: عند نشر الإصلاح اختبره مجددًا — الإصلاح الناقص ثغرة جديدة.
        ru: Когда исправление выйдет, проверьте его снова — неполное исправление это новый баг.
      - en: "One bug means the same developer probably made more: spend 20 minutes on similar endpoints."
        de: "Ein Bug bedeutet, dass derselbe Entwickler vermutlich weitere gemacht hat: 20 Minuten ähnliche Endpoints prüfen."
        fr: "Un bug signifie que le même développeur en a sans doute fait d’autres : passez 20 minutes sur des endpoints similaires."
        ar: "ثغرة واحدة تعني غالبًا أن المطوّر نفسه ارتكب غيرها: اقضِ 20 دقيقة على نقاط نهاية مشابهة."
        ru: "Один баг — значит, тот же разработчик, вероятно, допустил и другие: потратьте 20 минут на похожие эндпоинты."
      - en: Read public write-ups for the target’s technology, add new tricks to your checklist and automate repeated steps.
        de: Öffentliche Write-ups zur Technologie des Ziels lesen, neue Tricks in die Checkliste aufnehmen und Wiederholtes automatisieren.
        fr: Lisez des write-ups publics sur la technologie de la cible, ajoutez les nouvelles astuces à votre checklist et automatisez les étapes répétées.
        ar: اقرأ الشروحات العامة عن تقنية الهدف، وأضف الحيل الجديدة إلى قائمة تحققك، وأتمت الخطوات المتكررة.
        ru: Читайте публичные разборы по технологии цели, добавляйте новые приёмы в чек-лист и автоматизируйте повторяющееся.
