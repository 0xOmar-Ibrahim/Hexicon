# Hexicon's combined bug bounty methodology, rendered on the website and in docs/bug-bounty-methodology.md.
# Written in our own words from the sources listed per phase (resources in data/resources/). Every text has en/de/fr/ar/ru.
id: bug-bounty
title:
  en: The Hexicon Bug Bounty Methodology
  de: Die Hexicon-Bug-Bounty-Methodik
  fr: La méthodologie bug bounty de Hexicon
  ar: منهجية Hexicon لصيد الثغرات
  ru: Методология баг-баунти Hexicon
lead:
  en: "One workflow built from the best public methodologies: scope first, a clear goal per session, wide recon, deep understanding, two-eye testing, proven impact and reports triagers love. Every phase has a goal, a concrete output and the tools to get there."
  de: "Ein Ablauf aus den besten öffentlichen Methodiken: zuerst der Scope, ein klares Ziel pro Session, breites Recon, tiefes Verständnis, Testen mit zwei Augen, belegte Auswirkung und Reports, die Triager lieben. Jede Phase hat ein Ziel, ein konkretes Ergebnis und die passenden Tools."
  fr: "Un déroulé construit à partir des meilleures méthodologies publiques : le périmètre d’abord, un objectif clair par session, une recon large, une compréhension profonde, des tests « à deux yeux », un impact prouvé et des rapports appréciés des trieurs. Chaque phase a un objectif, un livrable concret et ses outils."
  ar: "سير عمل واحد مبني من أفضل المنهجيات العامة: النطاق أولًا، هدف واضح لكل جلسة، استطلاع واسع، فهم عميق، اختبار «بعينين»، أثر مُثبت، وتقارير يحبها فريق الفرز. لكل مرحلة هدف ومخرج ملموس وأدوات للوصول إليه."
  ru: "Единый процесс, собранный из лучших публичных методологий: сначала скоуп, чёткая цель на сессию, широкая разведка, глубокое понимание, тестирование «двумя глазами», доказанное влияние и отчёты, которые нравятся триажерам. У каждой фазы есть цель, конкретный результат и инструменты."
warning:
  en: "Authorized testing only: hunt only on programs you joined and only on in-scope assets, following each program’s rules."
  de: "Nur autorisierte Tests: Jagen Sie nur in Programmen, denen Sie beigetreten sind, nur auf Assets im Scope und nach den Regeln des Programms."
  fr: "Tests autorisés uniquement : chassez seulement sur les programmes que vous avez rejoints, sur les actifs dans le périmètre, en respectant leurs règles."
  ar: "للاختبار المصرّح به فقط: اصطد فقط في البرامج التي انضممت إليها، وعلى الأصول الواقعة ضمن النطاق، مع الالتزام بقواعد كل برنامج."
  ru: "Только авторизованное тестирование: охотьтесь лишь в программах, к которым присоединились, только на активах в скоупе и по правилам программы."
rules:
  - title:
      en: 5-minute rule
      de: 5-Minuten-Regel
      fr: Règle des 5 minutes
      ar: قاعدة الدقائق الخمس
      ru: Правило 5 минут
    text:
      en: Nothing interesting on a host after 5 minutes? Move to the next host.
      de: Nach 5 Minuten nichts Interessantes auf einem Host? Weiter zum nächsten.
      fr: Rien d’intéressant sur un hôte après 5 minutes ? Passez au suivant.
      ar: لا شيء مثير على المضيف بعد 5 دقائق؟ انتقل إلى التالي.
      ru: Ничего интересного на хосте за 5 минут? Переходите к следующему.
  - title:
      en: 20-minute rotation
      de: 20-Minuten-Rotation
      fr: Rotation de 20 minutes
      ar: التدوير كل 20 دقيقة
      ru: Ротация каждые 20 минут
    text:
      en: 'Every 20 minutes ask "am I making progress?" If not, rotate: endpoint → host → vulnerability class → target.'
      de: "Alle 20 Minuten fragen: „Komme ich voran?“ Wenn nicht, rotieren: Endpoint → Host → Schwachstellenklasse → Ziel."
      fr: "Toutes les 20 minutes, demandez-vous « est-ce que j’avance ? ». Sinon, changez : endpoint → hôte → classe de vulnérabilité → cible."
      ar: "كل 20 دقيقة اسأل: «هل أتقدّم؟» إن لم تكن، فبدّل: نقطة النهاية ← المضيف ← فئة الثغرة ← الهدف."
      ru: "Каждые 20 минут спрашивайте: «Есть ли прогресс?» Если нет — меняйте: эндпоинт → хост → класс уязвимости → цель."
  - title:
      en: 45-minute cap
      de: 45-Minuten-Grenze
      fr: Limite de 45 minutes
      ar: حدّ الـ45 دقيقة
      ru: Лимит 45 минут
    text:
      en: Never spend more than 45 minutes on one parameter. Write it down and come back later.
      de: Nie mehr als 45 Minuten an einem Parameter. Notieren und später wiederkommen.
      fr: Jamais plus de 45 minutes sur un même paramètre. Notez-le et revenez plus tard.
      ar: لا تقضِ أكثر من 45 دقيقة على معامل واحد. دوّنه وعُد إليه لاحقًا.
      ru: Не тратьте больше 45 минут на один параметр. Запишите и вернитесь позже.
  - title:
      en: Two weeks, one target
      de: Zwei Wochen, ein Ziel
      fr: Deux semaines, une cible
      ar: أسبوعان، هدف واحد
      ru: Две недели — одна цель
    text:
      en: Stay on one program for at least two weeks (~30 hours). Depth finds unique bugs; hopping finds duplicates.
      de: Mindestens zwei Wochen (~30 Stunden) bei einem Programm bleiben. Tiefe findet einzigartige Bugs, Springen findet Duplikate.
      fr: Restez au moins deux semaines (~30 h) sur un programme. La profondeur trouve des bugs uniques ; papillonner donne des doublons.
      ar: التزم ببرنامج واحد أسبوعين على الأقل (~30 ساعة). العمق يجد ثغرات فريدة، والتنقّل يجد ثغرات مكررة.
      ru: Держитесь одной программы минимум две недели (~30 часов). Глубина даёт уникальные баги, прыжки — дубликаты.
  - title:
      en: Automate lists, keep judgment
      de: Listen automatisieren, Urteil behalten
      fr: Automatiser les listes, garder le jugement
      ar: أتمت القوائم واحتفظ بالحكم
      ru: Автоматизируйте списки, не суждение
    text:
      en: Tools and AI generate candidates fast. Deciding what is real, proving it and standing behind the report is your job.
      de: Tools und KI erzeugen schnell Kandidaten. Entscheiden, was echt ist, es beweisen und für den Report geradestehen bleibt Ihre Aufgabe.
      fr: Outils et IA génèrent vite des candidats. Décider ce qui est réel, le prouver et assumer le rapport reste votre travail.
      ar: الأدوات والذكاء الاصطناعي تولّد المرشحين بسرعة. أما تحديد الحقيقي وإثباته وتحمّل مسؤولية التقرير فهي مهمتك.
      ru: Инструменты и ИИ быстро дают кандидатов. Решать, что реально, доказывать и отвечать за отчёт — ваша работа.
phases:
  - id: scope
    icon: flag
    title:
      en: Scope & rules
      de: Scope & Regeln
      fr: Périmètre & règles
      ar: النطاق والقواعد
      ru: Скоуп и правила
    goal:
      en: Know exactly what you may test, and how.
      de: Genau wissen, was und wie Sie testen dürfen.
      fr: Savoir exactement ce que vous pouvez tester, et comment.
      ar: اعرف بدقة ما المسموح لك باختباره وكيف.
      ru: Точно знать, что и как можно тестировать.
    output:
      en: A scope file and a list of forbidden actions.
      de: Eine Scope-Datei und eine Liste verbotener Aktionen.
      fr: Un fichier de périmètre et la liste des actions interdites.
      ar: ملف نطاق وقائمة بالأفعال المحظورة.
      ru: Файл скоупа и список запрещённых действий.
    steps:
      - en: "Read the whole policy: in-scope and out-of-scope assets, banned tests (DoS, social engineering, spam) and known issues."
        de: "Die ganze Policy lesen: Assets im und außerhalb des Scopes, verbotene Tests (DoS, Social Engineering, Spam) und bekannte Probleme."
        fr: "Lisez toute la politique : actifs dans et hors périmètre, tests interdits (DoS, ingénierie sociale, spam) et problèmes connus."
        ar: "اقرأ السياسة كاملة: الأصول داخل النطاق وخارجه، الاختبارات المحظورة (حجب الخدمة، الهندسة الاجتماعية، الرسائل المزعجة) والمشكلات المعروفة."
        ru: "Прочитайте политику целиком: активы в скоупе и вне его, запрещённые тесты (DoS, социальная инженерия, спам) и известные проблемы."
      - en: Write the scope into a file and filter every tool’s output against it.
        de: Den Scope in eine Datei schreiben und jede Tool-Ausgabe damit filtern.
        fr: Écrivez le périmètre dans un fichier et filtrez chaque sortie d’outil avec.
        ar: اكتب النطاق في ملف وصفِّ مخرجات كل أداة على أساسه.
        ru: Запишите скоуп в файл и фильтруйте по нему вывод каждого инструмента.
      - en: Set tools to the allowed request rate and add any required header (for example your researcher ID).
        de: Tools auf die erlaubte Request-Rate einstellen und nötige Header ergänzen (z. B. Ihre Researcher-ID).
        fr: Réglez vos outils au débit autorisé et ajoutez les en-têtes requis (par exemple votre identifiant de chercheur).
        ar: اضبط الأدوات على معدّل الطلبات المسموح وأضف أي ترويسة مطلوبة (مثل معرّفك كباحث).
        ru: Настройте инструменты на разрешённую частоту запросов и добавьте нужные заголовки (например, ID исследователя).
      - en: Create your own test accounts — never touch real users’ data.
        de: Eigene Testkonten anlegen – niemals echte Nutzerdaten anfassen.
        fr: Créez vos propres comptes de test — ne touchez jamais aux données de vrais utilisateurs.
        ar: أنشئ حسابات اختبار خاصة بك — ولا تلمس بيانات مستخدمين حقيقيين أبدًا.
        ru: Создайте свои тестовые аккаунты — никогда не трогайте данные реальных пользователей.
    tools: []
    sources:
      - offensive/xhack-bug-bounty-methodology
      - offensive/intigriti-crafting-bug-bounty-methodology
  - id: plan
    icon: compass
    title:
      en: Mindset & session plan
      de: Mindset & Session-Plan
      fr: État d’esprit & plan de session
      ar: العقلية وخطة الجلسة
      ru: Мышление и план сессии
    goal:
      en: Hunt with a goal instead of wandering.
      de: Mit einem Ziel jagen statt umherzuirren.
      fr: Chasser avec un objectif plutôt qu’au hasard.
      ar: اصطد بهدف بدل التجوّل العشوائي.
      ru: Охотиться с целью, а не бродить наугад.
    output:
      en: "One sentence: today I target [feature] to achieve [impact]."
      de: "Ein Satz: Heute ziele ich auf [Funktion], um [Auswirkung] zu erreichen."
      fr: "Une phrase : aujourd’hui je cible [fonction] pour obtenir [impact]."
      ar: "جملة واحدة: اليوم أستهدف [الميزة] لتحقيق [الأثر]."
      ru: "Одно предложение: сегодня я атакую [функцию], чтобы добиться [влияния]."
    steps:
      - en: "Pick one impact: steal data, change data, take over an account, or run code on the server."
        de: "Eine Auswirkung wählen: Daten stehlen, Daten ändern, Konto übernehmen oder Code auf dem Server ausführen."
        fr: "Choisissez un impact : voler des données, modifier des données, prendre le contrôle d’un compte ou exécuter du code sur le serveur."
        ar: "اختر أثرًا واحدًا: سرقة بيانات، تعديل بيانات، الاستيلاء على حساب، أو تنفيذ أوامر على الخادم."
        ru: "Выберите одно влияние: кража данных, изменение данных, захват аккаунта или выполнение кода на сервере."
      - en: Select one or two vulnerability classes that fit your strengths, and test only those.
        de: Ein oder zwei Schwachstellenklassen passend zu Ihren Stärken wählen und nur diese testen.
        fr: Sélectionnez une ou deux classes de vulnérabilités adaptées à vos points forts, et testez seulement celles-là.
        ar: اختر فئة أو فئتين من الثغرات تناسبان نقاط قوتك، واختبرهما فقط.
        ru: Выберите один-два класса уязвимостей под свои сильные стороны и тестируйте только их.
      - en: "Choose the route: Wide (new program, wildcard scope, new assets) or Deep (main app, logic and access-control bugs)."
        de: "Route wählen: Breit (neues Programm, Wildcard-Scope, neue Assets) oder Tief (Haupt-App, Logik- und Zugriffsfehler)."
        fr: "Choisissez la voie : Large (nouveau programme, périmètre wildcard, nouveaux actifs) ou Profonde (appli principale, bugs de logique et de contrôle d’accès)."
        ar: "اختر المسار: واسع (برنامج جديد، نطاق شامل، أصول جديدة) أو عميق (التطبيق الرئيسي، ثغرات المنطق والتحكم في الوصول)."
        ru: "Выберите маршрут: вширь (новая программа, wildcard-скоуп, новые активы) или вглубь (основное приложение, логика и контроль доступа)."
    tools: []
    sources:
      - offensive/claude-bug-bounty-bb-methodology
      - offensive/intigriti-crafting-bug-bounty-methodology
      - offensive/zseano-methodology
  - id: recon
    icon: radar
    title:
      en: "Recon: map the attack surface"
      de: "Recon: Angriffsfläche erfassen"
      fr: "Recon : cartographier la surface d’attaque"
      ar: "الاستطلاع: رسم سطح الهجوم"
      ru: "Разведка: карта поверхности атаки"
    goal:
      en: Find the assets others missed.
      de: Die Assets finden, die andere übersehen haben.
      fr: Trouver les actifs que les autres ont manqués.
      ar: اعثر على الأصول التي فاتت الآخرين.
      ru: Найти активы, которые пропустили другие.
    output:
      en: A hand-reviewed list of live, in-scope hosts and URLs.
      de: Eine manuell geprüfte Liste aktiver Hosts und URLs im Scope.
      fr: Une liste vérifiée à la main d’hôtes et d’URL actifs dans le périmètre.
      ar: قائمة مُراجَعة يدويًا بالمضيفات والروابط النشطة ضمن النطاق.
      ru: Проверенный вручную список живых хостов и URL в скоупе.
    steps:
      - en: "Passive first: subdomains from certificate logs, passive DNS sources and code search, then merge and deduplicate."
        de: "Zuerst passiv: Subdomains aus Zertifikatslogs, passiven DNS-Quellen und Code-Suche, dann zusammenführen und deduplizieren."
        fr: "Le passif d’abord : sous-domaines issus des journaux de certificats, du DNS passif et de la recherche de code, puis fusion et dédoublonnage."
        ar: "السلبي أولًا: النطاقات الفرعية من سجلات الشهادات ومصادر DNS السلبية والبحث في الشيفرة، ثم الدمج وإزالة التكرار."
        ru: "Сначала пассивно: поддомены из журналов сертификатов, пассивного DNS и поиска по коду, затем объединение и дедупликация."
      - en: "Then active: resolve and brute-force names with good wordlists; for wide scopes add ASN, IP ranges and reverse DNS."
        de: "Dann aktiv: Namen auflösen und mit guten Wortlisten brute-forcen; bei breitem Scope ASN, IP-Bereiche und Reverse-DNS ergänzen."
        fr: "Puis l’actif : résolution et brute-force avec de bonnes wordlists ; pour un périmètre large, ajoutez ASN, plages IP et DNS inverse."
        ar: "ثم النشط: حلّ الأسماء وتخمينها بقوائم كلمات جيدة؛ وللنطاقات الواسعة أضف ASN ونطاقات IP وDNS العكسي."
        ru: "Затем активно: резолв и брутфорс имён по хорошим словарям; для широкого скоупа — ASN, диапазоны IP и обратный DNS."
      - en: Probe live hosts on common and unusual ports; record title, status code and technology.
        de: Aktive Hosts auf üblichen und ungewöhnlichen Ports prüfen; Titel, Statuscode und Technologie notieren.
        fr: Sondez les hôtes actifs sur les ports courants et inhabituels ; notez titre, code d’état et technologie.
        ar: افحص المضيفات النشطة على المنافذ الشائعة وغير المعتادة؛ وسجّل العنوان ورمز الحالة والتقنية.
        ru: Проверьте живые хосты на обычных и необычных портах; запишите заголовок, код ответа и технологию.
      - en: Collect old and crawled URLs (web archives plus a crawler), then deduplicate.
        de: Alte und gecrawlte URLs sammeln (Webarchive plus Crawler), dann deduplizieren.
        fr: Collectez les URL anciennes et crawlées (archives web + crawler), puis dédoublonnez.
        ar: اجمع الروابط القديمة والمزحوفة (أرشيفات الويب مع زاحف)، ثم أزل التكرار.
        ru: Соберите старые и найденные краулером URL (веб-архивы плюс краулер), затем удалите дубли.
      - en: Check right away for subdomain takeovers and open cloud storage — these are quick wins.
        de: Sofort auf Subdomain-Takeover und offenen Cloud-Speicher prüfen – schnelle Treffer.
        fr: Vérifiez tout de suite les takeovers de sous-domaines et le stockage cloud ouvert — des gains rapides.
        ar: افحص فورًا الاستيلاء على النطاقات الفرعية والتخزين السحابي المفتوح — مكاسب سريعة.
        ru: Сразу проверьте захват поддоменов и открытые облачные хранилища — быстрые находки.
      - en: "Review the list by hand: dev, staging, admin, internal and odd-port hosts go to the top."
        de: "Liste manuell prüfen: Dev-, Staging-, Admin-, interne Hosts und solche mit ungewöhnlichen Ports nach oben."
        fr: "Relisez la liste à la main : hôtes dev, staging, admin, internes et sur ports inhabituels en premier."
        ar: "راجع القائمة يدويًا: مضيفات التطوير والاختبار والإدارة والداخلية وذات المنافذ الغريبة في المقدمة."
        ru: "Просмотрите список вручную: dev, staging, admin, внутренние хосты и хосты на необычных портах — наверх."
    tools:
      - threat-intel/subfinder
      - threat-intel/owasp-amass
      - offensive/dnsx
      - offensive/httpx
      - offensive/naabu
      - offensive/gau
      - offensive/waymore
      - offensive/katana
      - offensive/subzy
      - offensive/reconftw
    sources:
      - offensive/amrelsagaei-bug-bounty-methodology-2025
      - offensive/phirojshah-bug-bounty-methodology-2025
      - offensive/phirojshah-bug-hunting-methodology
      - offensive/rednexus-bug-bounty-methodology
      - offensive/jhaddix-tbhm
      - offensive/six2dez-pentest-book
  - id: map
    icon: compass
    title:
      en: "Mapping: think like the developer"
      de: "Mapping: wie der Entwickler denken"
      fr: "Cartographie : penser comme le développeur"
      ar: "التخطيط: فكّر كالمطوّر"
      ru: "Картирование: думайте как разработчик"
    goal:
      en: Understand how the app works before you attack it.
      de: Verstehen, wie die App funktioniert, bevor Sie angreifen.
      fr: Comprendre le fonctionnement de l’appli avant de l’attaquer.
      ar: افهم كيف يعمل التطبيق قبل أن تهاجمه.
      ru: Понять, как работает приложение, прежде чем атаковать.
    output:
      en: Notes on endpoints, roles, the login model and the key business flows.
      de: Notizen zu Endpoints, Rollen, Login-Modell und den wichtigsten Geschäftsabläufen.
      fr: Des notes sur les endpoints, les rôles, le modèle d’authentification et les flux métier clés.
      ar: ملاحظات عن نقاط النهاية والأدوار ونموذج تسجيل الدخول وأهم مسارات العمل.
      ru: Заметки об эндпоинтах, ролях, модели входа и ключевых бизнес-процессах.
    steps:
      - en: Use the app as a normal user through your proxy and build the site map.
        de: Die App als normaler Nutzer über den Proxy bedienen und die Sitemap aufbauen.
        fr: Utilisez l’appli comme un utilisateur normal via votre proxy et construisez le plan du site.
        ar: استخدم التطبيق كمستخدم عادي عبر البروكسي وابنِ خريطة الموقع.
        ru: Пользуйтесь приложением как обычный пользователь через прокси и постройте карту сайта.
      - en: Identify how login works (cookies, JWT, OAuth, SAML) and every role and permission.
        de: Ermitteln, wie der Login funktioniert (Cookies, JWT, OAuth, SAML), sowie alle Rollen und Rechte.
        fr: Identifiez le fonctionnement de la connexion (cookies, JWT, OAuth, SAML) et chaque rôle et permission.
        ar: حدّد كيف يعمل تسجيل الدخول (ملفات تعريف الارتباط، JWT، OAuth، SAML) وكل الأدوار والصلاحيات.
        ru: Определите, как устроен вход (cookie, JWT, OAuth, SAML), и все роли и права.
      - en: "List the business-critical flows: sign-up, password reset, payments, invitations, data export."
        de: "Die geschäftskritischen Abläufe auflisten: Registrierung, Passwort-Reset, Zahlungen, Einladungen, Datenexport."
        fr: "Listez les flux critiques : inscription, réinitialisation du mot de passe, paiements, invitations, export de données."
        ar: "اذكر المسارات الحرجة للعمل: التسجيل، استعادة كلمة المرور، المدفوعات، الدعوات، تصدير البيانات."
        ru: "Перечислите критичные процессы: регистрация, сброс пароля, платежи, приглашения, экспорт данных."
      - en: Read the JavaScript files for hidden routes, parameters and secrets; discover hidden parameters and API routes.
        de: JavaScript-Dateien nach versteckten Routen, Parametern und Secrets durchsuchen; versteckte Parameter und API-Routen finden.
        fr: Lisez les fichiers JavaScript pour trouver routes, paramètres et secrets cachés ; découvrez paramètres et routes d’API cachés.
        ar: اقرأ ملفات JavaScript بحثًا عن مسارات ومعاملات وأسرار مخفية؛ واكتشف المعاملات ومسارات API المخفية.
        ru: Изучите JavaScript-файлы на скрытые маршруты, параметры и секреты; найдите скрытые параметры и API-маршруты.
      - en: "Read the product docs and changelog: what should be impossible? New features are the least tested."
        de: "Produktdoku und Changelog lesen: Was sollte unmöglich sein? Neue Funktionen sind am wenigsten getestet."
        fr: "Lisez la doc produit et le changelog : qu’est-ce qui devrait être impossible ? Les nouveautés sont les moins testées."
        ar: "اقرأ توثيق المنتج وسجل التغييرات: ما الذي يجب أن يكون مستحيلًا؟ الميزات الجديدة هي الأقل اختبارًا."
        ru: "Читайте документацию и changelog: что должно быть невозможно? Новые функции протестированы хуже всего."
      - en: "Write down anything strange: naming changes, different error formats, old API versions that still answer."
        de: "Alles Seltsame notieren: Namenswechsel, abweichende Fehlerformate, alte API-Versionen, die noch antworten."
        fr: "Notez tout ce qui est étrange : changements de nommage, formats d’erreur différents, anciennes versions d’API qui répondent encore."
        ar: "دوّن كل ما هو غريب: تغيّر التسميات، اختلاف صيغ الأخطاء، إصدارات API قديمة ما زالت تستجيب."
        ru: "Записывайте всё странное: смену именования, разные форматы ошибок, старые версии API, которые ещё отвечают."
