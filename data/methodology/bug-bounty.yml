  - id: prioritize
    icon: crosshair
    title:
      en: Prioritise
      de: Priorisieren
      fr: Prioriser
      ar: تحديد الأولويات
      ru: Приоритизация
    goal:
      en: Spend your time where bugs are most likely.
      de: Zeit dort einsetzen, wo Bugs am wahrscheinlichsten sind.
      fr: Passer son temps là où les bugs sont les plus probables.
      ar: اقضِ وقتك حيث يُرجّح وجود الثغرات.
      ru: Тратить время там, где баги вероятнее всего.
    output:
      en: A ranked target list with one reason per target.
      de: Eine priorisierte Zielliste mit einer Begründung pro Ziel.
      fr: Une liste de cibles classées avec une raison pour chacune.
      ar: قائمة أهداف مرتّبة مع سبب لكل هدف.
      ru: Ранжированный список целей с причиной для каждой.
    steps:
      - en: Rank features and hosts by possible impact and by how likely developers cut corners.
        de: Funktionen und Hosts nach möglicher Auswirkung und nach der Wahrscheinlichkeit sortieren, dass Entwickler Abkürzungen nahmen.
        fr: Classez fonctions et hôtes selon l’impact possible et la probabilité que les développeurs aient pris des raccourcis.
        ar: رتّب الميزات والمضيفات حسب الأثر المحتمل واحتمال أن المطورين اختصروا الطريق.
        ru: Ранжируйте функции и хосты по возможному влиянию и вероятности, что разработчики срезали углы.
      - en: Favour new features, complex flows (coupons, refunds, roles), legacy API versions and non-production environments.
        de: Neue Funktionen, komplexe Abläufe (Gutscheine, Erstattungen, Rollen), alte API-Versionen und Nicht-Produktivumgebungen bevorzugen.
        fr: Privilégiez les nouveautés, les flux complexes (coupons, remboursements, rôles), les anciennes versions d’API et les environnements hors production.
        ar: فضّل الميزات الجديدة والمسارات المعقدة (القسائم، الاسترداد، الأدوار) وإصدارات API القديمة والبيئات غير الإنتاجية.
        ru: Отдавайте приоритет новым функциям, сложным процессам (купоны, возвраты, роли), старым версиям API и непродуктивным средам.
      - en: If one feature has strong checks, look for a similar, newer feature that may not.
        de: Hat eine Funktion starke Prüfungen, nach einer ähnlichen, neueren Funktion suchen, der sie fehlen könnten.
        fr: Si une fonction a de bons contrôles, cherchez une fonction similaire plus récente qui pourrait en manquer.
        ar: إذا كانت لميزة ما فحوص قوية، فابحث عن ميزة مشابهة أحدث قد تفتقر إليها.
        ru: Если у одной функции строгие проверки, ищите похожую, более новую функцию, где их может не быть.
    tools: []
    sources:
      - offensive/xhack-bug-bounty-methodology
      - offensive/claude-bug-bounty-bb-methodology
      - offensive/intigriti-crafting-bug-bounty-methodology
  - id: test
    icon: magnifier
    title:
      en: Test with two eyes
      de: Mit zwei Augen testen
      fr: Tester avec deux yeux
      ar: اختبر بعينين
      ru: Тестируйте двумя глазами
    goal:
      en: Turn every idea into a small, repeatable experiment.
      de: Jede Idee in ein kleines, wiederholbares Experiment verwandeln.
      fr: Transformer chaque idée en une petite expérience reproductible.
      ar: حوّل كل فكرة إلى تجربة صغيرة قابلة للتكرار.
      ru: Превращать каждую идею в маленький воспроизводимый эксперимент.
    output:
      en: Tested hypotheses with results — including the ones that failed.
      de: Getestete Hypothesen mit Ergebnissen – auch die gescheiterten.
      fr: Des hypothèses testées avec leurs résultats — y compris les échecs.
      ar: فرضيات مختبرة مع نتائجها — بما فيها الفاشلة.
      ru: Проверенные гипотезы с результатами — включая неудачные.
    steps:
      - en: "First eye, systematic — test each input by what it does: IDs → IDOR; URLs and webhooks → SSRF; reflected text → XSS; search and filters → SQL/NoSQL injection; uploads → XSS, RCE, path traversal; prices and coupons → logic and race conditions; login, 2FA and reset → auth bypass; profile updates → mass assignment; templates → SSTI."
        de: "Erstes Auge, systematisch – jede Eingabe nach ihrer Funktion testen: IDs → IDOR; URLs und Webhooks → SSRF; reflektierter Text → XSS; Suche und Filter → SQL/NoSQL-Injection; Uploads → XSS, RCE, Path Traversal; Preise und Gutscheine → Logik und Race Conditions; Login, 2FA und Reset → Auth-Bypass; Profiländerungen → Mass Assignment; Templates → SSTI."
        fr: "Premier œil, systématique — testez chaque entrée selon son rôle : identifiants → IDOR ; URL et webhooks → SSRF ; texte réfléchi → XSS ; recherche et filtres → injection SQL/NoSQL ; uploads → XSS, RCE, path traversal ; prix et coupons → logique et race conditions ; connexion, 2FA et réinitialisation → contournement d’authentification ; mise à jour du profil → mass assignment ; templates → SSTI."
        ar: "العين الأولى، منهجية — اختبر كل مُدخل حسب وظيفته: المعرّفات ← IDOR؛ الروابط وwebhooks ← SSRF؛ النص المنعكس ← XSS؛ البحث والفلاتر ← حقن SQL/NoSQL؛ رفع الملفات ← XSS وRCE وتجاوز المسار؛ الأسعار والقسائم ← المنطق وحالات السباق؛ الدخول والمصادقة الثنائية والاستعادة ← تجاوز المصادقة؛ تحديث الملف الشخصي ← الإسناد الجماعي؛ القوالب ← SSTI."
        ru: "Первый глаз, систематически — тестируйте каждый ввод по его назначению: ID → IDOR; URL и вебхуки → SSRF; отражённый текст → XSS; поиск и фильтры → SQL/NoSQL-инъекции; загрузки → XSS, RCE, path traversal; цены и купоны → логика и гонки; вход, 2FA и сброс → обход аутентификации; обновление профиля → mass assignment; шаблоны → SSTI."
      - en: "Second eye, anomalies — look for what feels wrong: exposed credentials, forgotten hosts, admin panels, debug pages, unusual errors."
        de: "Zweites Auge, Auffälligkeiten – nach dem suchen, was sich falsch anfühlt: offene Zugangsdaten, vergessene Hosts, Admin-Panels, Debug-Seiten, ungewöhnliche Fehler."
        fr: "Second œil, anomalies — cherchez ce qui cloche : identifiants exposés, hôtes oubliés, panneaux d’administration, pages de debug, erreurs inhabituelles."
        ar: "العين الثانية، الشذوذ — ابحث عمّا يبدو خاطئًا: بيانات اعتماد مكشوفة، مضيفات منسية، لوحات إدارة، صفحات تصحيح، أخطاء غير مألوفة."
        ru: "Второй глаз, аномалии — ищите то, что выглядит не так: открытые учётные данные, забытые хосты, админ-панели, debug-страницы, необычные ошибки."
      - en: "Probe in this order: error-based, then time-based, then out-of-band, then boolean differences."
        de: "In dieser Reihenfolge sondieren: fehlerbasiert, dann zeitbasiert, dann Out-of-Band, dann boolesche Unterschiede."
        fr: "Sondez dans cet ordre : basé sur l’erreur, puis sur le temps, puis hors bande, puis différences booléennes."
        ar: "افحص بهذا الترتيب: المعتمد على الأخطاء، ثم على الوقت، ثم خارج النطاق (OOB)، ثم الفروق المنطقية."
        ru: "Проверяйте в таком порядке: по ошибкам, по времени, out-of-band, затем по булевым различиям."
      - en: Test access control with two accounts and every role, sideways (user A → user B) and upwards (user → admin).
        de: Zugriffskontrolle mit zwei Konten und allen Rollen testen, seitwärts (Nutzer A → Nutzer B) und aufwärts (Nutzer → Admin).
        fr: Testez le contrôle d’accès avec deux comptes et chaque rôle, horizontalement (utilisateur A → B) et verticalement (utilisateur → admin).
        ar: اختبر التحكم في الوصول بحسابين وكل الأدوار، أفقيًا (المستخدم أ ← ب) وعموديًا (مستخدم ← مدير).
        ru: Тестируйте контроль доступа двумя аккаунтами и всеми ролями, горизонтально (A → B) и вертикально (пользователь → админ).
      - en: Run scanners for known CVEs and exposures, then move on — manual testing finds the unique bugs.
        de: Scanner für bekannte CVEs und Expositionen laufen lassen, dann weiter – manuelles Testen findet die einzigartigen Bugs.
        fr: Lancez les scanners pour les CVE et expositions connues, puis passez à autre chose — les tests manuels trouvent les bugs uniques.
        ar: شغّل الماسحات للثغرات المعروفة والانكشافات ثم امضِ قدمًا — الاختبار اليدوي هو ما يجد الثغرات الفريدة.
        ru: Запустите сканеры на известные CVE и утечки и двигайтесь дальше — уникальные баги находит ручное тестирование.
      - en: Write down every idea that failed, so you never test it twice.
        de: Jede gescheiterte Idee notieren, damit Sie sie nie doppelt testen.
        fr: Notez chaque idée qui a échoué pour ne jamais la tester deux fois.
        ar: دوّن كل فكرة فشلت حتى لا تختبرها مرتين.
        ru: Записывайте каждую неудачную идею, чтобы не проверять её дважды.
    tools:
      - offensive/nuclei
      - offensive/ffuf
      - offensive/dalfox
      - offensive/sqlmap
      - offensive/interactsh
      - offensive/burp-suite
    sources:
      - offensive/amrelsagaei-bug-bounty-methodology-2025
      - offensive/claude-bug-bounty-bb-methodology
      - offensive/howtohunt
      - offensive/rednexus-bug-bounty-methodology
      - offensive/owasp-web-security-testing-guide
      - offensive/portswigger-web-security-academy
  - id: prove
    icon: alert
    title:
      en: Prove & escalate
      de: Beweisen & eskalieren
      fr: Prouver & escalader
      ar: الإثبات والتصعيد
      ru: Доказать и эскалировать
    goal:
      en: Show the real, honest impact.
      de: Die echte, ehrliche Auswirkung zeigen.
      fr: Montrer l’impact réel et honnête.
      ar: أظهر الأثر الحقيقي بأمانة.
      ru: Показать реальное, честное влияние.
    output:
      en: A working proof of concept with the highest impact you can truly show.
      de: Ein funktionierender Proof of Concept mit der höchsten Auswirkung, die Sie wirklich zeigen können.
      fr: Une preuve de concept fonctionnelle avec le plus fort impact que vous pouvez réellement démontrer.
      ar: إثبات مفهوم يعمل بأعلى أثر يمكنك إظهاره فعلًا.
      ru: Рабочий PoC с максимальным влиянием, которое вы действительно можете показать.
    steps:
      - en: 'Ask "what can an attacker actually do?" and chain small findings into real harm: XSS → account takeover, open redirect → OAuth token theft, IDOR → large-scale data exposure.'
        de: "Fragen: „Was kann ein Angreifer wirklich tun?“ und kleine Funde zu echtem Schaden verketten: XSS → Kontoübernahme, Open Redirect → OAuth-Token-Diebstahl, IDOR → Datenabfluss im großen Stil."
        fr: "Demandez-vous « que peut réellement faire un attaquant ? » et enchaînez les petites découvertes en vrai dommage : XSS → prise de compte, open redirect → vol de jeton OAuth, IDOR → fuite massive de données."
        ar: "اسأل: «ماذا يستطيع المهاجم فعله حقًا؟» واربط النتائج الصغيرة بضرر حقيقي: XSS ← الاستيلاء على الحساب، إعادة التوجيه المفتوحة ← سرقة رمز OAuth، IDOR ← تسريب بيانات واسع."
        ru: "Спросите: «Что на самом деле может атакующий?» и сцепите мелкие находки в реальный вред: XSS → захват аккаунта, open redirect → кража OAuth-токена, IDOR → массовая утечка данных."
      - en: "Cut the prerequisites: aim for zero or one click and realistic conditions."
        de: "Voraussetzungen reduzieren: null oder ein Klick und realistische Bedingungen anstreben."
        fr: "Réduisez les prérequis : visez zéro ou un clic et des conditions réalistes."
        ar: "قلّل المتطلبات المسبقة: استهدف نقرة واحدة أو بدون نقر وظروفًا واقعية."
        ru: "Сократите предусловия: ноль или один клик и реалистичные условия."
      - en: A DNS callback alone is not an SSRF report — show what internal access it gives.
        de: Ein DNS-Callback allein ist kein SSRF-Report – zeigen, welchen internen Zugriff er ermöglicht.
        fr: Un simple rappel DNS n’est pas un rapport SSRF — montrez l’accès interne obtenu.
        ar: استدعاء DNS وحده ليس تقرير SSRF — أظهر الوصول الداخلي الذي يمنحه.
        ru: Один DNS-callback — ещё не отчёт об SSRF; покажите, какой внутренний доступ он даёт.
      - en: "Stay within the rules: prove impact with your own accounts and minimal data, and never keep other people’s data."
        de: "In den Regeln bleiben: Auswirkung mit eigenen Konten und minimalen Daten belegen und niemals fremde Daten behalten."
        fr: "Restez dans les règles : prouvez l’impact avec vos propres comptes et un minimum de données, et ne conservez jamais les données d’autrui."
        ar: "التزم بالقواعد: أثبت الأثر بحساباتك الخاصة وبأقل قدر من البيانات، ولا تحتفظ أبدًا ببيانات الآخرين."
        ru: "Соблюдайте правила: доказывайте влияние своими аккаунтами и минимумом данных и никогда не храните чужие данные."
    tools: []
    sources:
      - offensive/claude-bug-bounty-bb-methodology
      - offensive/amrelsagaei-bug-bounty-methodology-2025
  - id: validate
    icon: shield
    title:
      en: Validate
      de: Validieren
      fr: Valider
      ar: التحقق
      ru: Проверка
    goal:
      en: Submit only real, reproducible bugs.
      de: Nur echte, reproduzierbare Bugs einreichen.
      fr: Ne soumettre que des bugs réels et reproductibles.
      ar: لا تُرسل إلا ثغرات حقيقية قابلة لإعادة الإنتاج.
      ru: Отправлять только реальные, воспроизводимые баги.
    output:
      en: A finding you reproduced yourself from a clean start.
      de: Ein Fund, den Sie selbst von einem sauberen Start aus reproduziert haben.
      fr: Un finding que vous avez reproduit vous-même depuis un état propre.
      ar: نتيجة أعدت إنتاجها بنفسك من بداية نظيفة.
      ru: Находка, которую вы сами воспроизвели с чистого листа.
    steps:
      - en: Reproduce it from scratch in a fresh browser session.
        de: Von Grund auf in einer frischen Browser-Session reproduzieren.
        fr: Reproduisez-le depuis zéro dans une nouvelle session de navigateur.
        ar: أعد إنتاجها من الصفر في جلسة متصفح جديدة.
        ru: Воспроизведите с нуля в новой сессии браузера.
      - en: Check that it is in scope, not on the known-issues or excluded list, and has real security impact.
        de: Prüfen, dass er im Scope liegt, nicht auf der Liste bekannter oder ausgeschlossener Probleme steht und echte Sicherheitsauswirkung hat.
        fr: Vérifiez qu’il est dans le périmètre, absent des problèmes connus ou exclus, et qu’il a un vrai impact de sécurité.
        ar: تأكد أنها ضمن النطاق، وليست في قائمة المشكلات المعروفة أو المستثناة، وأن لها أثرًا أمنيًا حقيقيًا.
        ru: Убедитесь, что находка в скоупе, не в списке известных или исключённых проблем и имеет реальное влияние на безопасность.
      - en: Score severity honestly with the CVSS version the platform uses, matching the impact you proved.
        de: Schweregrad ehrlich mit der CVSS-Version der Plattform bewerten, passend zur belegten Auswirkung.
        fr: Évaluez honnêtement la sévérité avec la version de CVSS utilisée par la plateforme, selon l’impact prouvé.
        ar: قيّم الخطورة بأمانة بإصدار CVSS الذي تستخدمه المنصة، بما يطابق الأثر الذي أثبتّه.
        ru: Честно оцените критичность по версии CVSS, которую использует платформа, в соответствии с доказанным влиянием.
      - en: If any check fails, drop it — invalid reports cost you reputation.
        de: Schlägt eine Prüfung fehl, verwerfen – ungültige Reports kosten Reputation.
        fr: Si une vérification échoue, abandonnez — les rapports invalides coûtent en réputation.
        ar: إذا فشل أي فحص فتخلَّ عنها — التقارير غير الصالحة تكلّفك سمعتك.
        ru: "Если хоть одна проверка не пройдена — откажитесь: невалидные отчёты бьют по репутации."
    tools: []
    sources:
      - offensive/xhack-bug-bounty-methodology
      - offensive/claude-bug-bounty-bb-methodology
  - id: report
    icon: code
    title:
      en: Report
      de: Report
      fr: Rapport
      ar: التقرير
      ru: Отчёт
    goal:
      en: Make the triager’s job easy.
      de: Dem Triager die Arbeit leicht machen.
      fr: Faciliter le travail du trieur.
      ar: سهّل مهمة فريق الفرز.
      ru: Облегчить работу триажера.
    output:
      en: A report someone can confirm in a few minutes.
      de: Ein Report, den jemand in wenigen Minuten bestätigen kann.
      fr: Un rapport que quelqu’un peut confirmer en quelques minutes.
      ar: تقرير يمكن لأي شخص تأكيده خلال دقائق.
      ru: Отчёт, который можно подтвердить за несколько минут.
    steps:
      - en: "Title: [Bug type] in [endpoint] lets [attacker] [impact]."
        de: "Titel: [Bug-Typ] in [Endpoint] ermöglicht [Angreifer] [Auswirkung]."
        fr: "Titre : [type de bug] dans [endpoint] permet à [attaquant] de [impact]."
        ar: "العنوان: [نوع الثغرة] في [نقطة النهاية] تسمح لـ[المهاجم] بـ[الأثر]."
        ru: "Заголовок: [тип бага] в [эндпоинт] позволяет [атакующему] [влияние]."
      - en: "First sentence: what an attacker can do."
        de: "Erster Satz: was ein Angreifer tun kann."
        fr: "Première phrase : ce que l’attaquant peut faire."
        ar: "الجملة الأولى: ما الذي يستطيع المهاجم فعله."
        ru: "Первое предложение: что может сделать атакующий."
      - en: Exact numbered steps with the raw HTTP requests, plus screenshots or a short video.
        de: Exakte nummerierte Schritte mit den rohen HTTP-Requests, dazu Screenshots oder ein kurzes Video.
        fr: Étapes numérotées exactes avec les requêtes HTTP brutes, plus captures d’écran ou courte vidéo.
        ar: خطوات مرقّمة دقيقة مع طلبات HTTP الخام، إضافة إلى لقطات شاشة أو فيديو قصير.
        ru: Точные пронумерованные шаги с сырыми HTTP-запросами, плюс скриншоты или короткое видео.
      - en: Impact, who is affected, and a suggested fix. Short and factual.
        de: Auswirkung, wer betroffen ist und ein Lösungsvorschlag. Kurz und sachlich.
        fr: Impact, personnes concernées et correctif suggéré. Court et factuel.
        ar: الأثر، ومن المتأثر، واقتراح للإصلاح. باختصار ودقة.
        ru: Влияние, кого это затрагивает, и предлагаемое исправление. Кратко и по фактам.
    tools: []
