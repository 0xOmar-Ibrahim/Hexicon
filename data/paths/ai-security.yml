  - { resource: ai-security/gandalf-lakera, note: "Get a hands-on feel for prompt injection." }
  - { resource: ai-security/portswigger-web-llm-attacks, note: "Attack LLM features inside web apps." }
  - { resource: ai-security/mitre-atlas, note: "Learn the adversary tactics against AI systems." }
  - { resource: ai-security/promptfoo, note: "Evaluate and red-team your own LLM app." }
  - { resource: ai-security/garak, note: "Scan models for known weaknesses." }
  - { resource: ai-security/nist-ai-risk-management-framework, note: "Govern AI risk at organisational level." }
