id: ai-security
icon: spark
level: intermediate
hours: 60
title:
  en: AI & LLM Security
  de: KI- & LLM-Sicherheit
  fr: Sécurité de l'IA & des LLM
  ar: أمن الذكاء الاصطناعي ونماذج اللغة
  ru: Безопасность ИИ и LLM
description:
  en: Understand prompt injection, agent risks and adversarial ML — then test and harden AI applications.
  de: Prompt Injection, Agentenrisiken und Adversarial ML verstehen — und KI-Anwendungen testen und härten.
  fr: Comprendre l'injection de prompt, les risques des agents et le ML adverse — puis tester et durcir les applications d'IA.
  ar: افهم حقن الأوامر ومخاطر الوكلاء والتعلم الآلي العدائي — ثم اختبر تطبيقات الذكاء الاصطناعي وعزّز أمنها.
  ru: Разберитесь в prompt injection, рисках агентов и состязательном МО — затем тестируйте и защищайте ИИ-приложения.
steps:
  - { resource: ai-security/owasp-top-10-for-llm-applications, note: "Map the risk landscape." }
